---
- name: "Check if packages are already installed" # noqa command-instead-of-module this runs faster
  ansible.builtin.command: "rpm -q {{ packages_list | join(' ') }}"
  register: activemq_rpm_info
  changed_when: False
  failed_when: False

- name: "Add missing packages to the install list"
  ansible.builtin.set_fact:
    activemq_packages_to_install: "{{ activemq_packages_to_install | default([]) + activemq_rpm_info.stdout_lines | map('regex_findall', 'package (.+) is not installed$') | default([]) | flatten }}"

- name: "Install packages: {{ activemq_packages_to_install }}"
  become: "{{ activemq_install_require_privileges_escalation | default(true) }}"
  ansible.builtin.dnf:
    name: "{{ activemq_packages_to_install }}"
    state: present
  when: activemq_packages_to_install | default([]) | length > 0
