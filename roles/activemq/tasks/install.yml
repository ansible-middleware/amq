---
- name: Validate parameters
  ansible.builtin.assert:
    that:
      - activemq.home is defined
      - activemq_service_user is defined
      - activemq_dest is defined
      - activemq.bundle is defined
      - activemq.download_url is defined
      - activemq.version is defined
    quiet: true

- name: "Create {{ activemq.service_name }} service group"
  become: "{{ activemq_install_require_privileges_escalation | default(true) }}"
  ansible.builtin.group:
    name: "{{ activemq_service_group }}"
    system: true

- name: "Create service user"
  block:
    - name: "Create {{ activemq.service_name }} service user"
      become: "{{ activemq_install_require_privileges_escalation | default(true) }}"
      ansible.builtin.user:
        name: "{{ activemq_service_user }}"
        group: "{{ activemq_service_group }}"
        home: "{{ activemq.user_home }}"
        system: true
        create_home: false
      register: activemq_user_mod
      failed_when: false
  rescue:
    - name: Display failure
      ansible.builtin.debug:
        msg: "Update user home_directory deferred to service restart, error can be ignored"
    - name: Set update user_mod to restarting handler
      ansible.builtin.set_fact:
        activemq_requires_userhome_update: true
      notify: restart amq_broker

- name: "Check {{ activemq.service_name }} install location"
  become: "{{ activemq_install_require_privileges_escalation | default(true) }}"
  ansible.builtin.stat:
    path: "{{ activemq_dest }}"
  register: activemq_install_location

- name: "Create {{ activemq.service_name }} install location"
  become: "{{ activemq_install_require_privileges_escalation | default(true) }}"
  ansible.builtin.file:
    dest: "{{ activemq_dest }}"
    state: directory
    owner: "{{ activemq_service_user }}"
    group: "{{ activemq_service_group }}"
    mode: '0750'
  when:
    - not activemq_install_location.stat.exists

- name: Verify file ownership for existing install location
  ansible.builtin.command: |
    chown -R {{ activemq_service_user }}:{{ activemq_service_group }} {{ activemq_dest }}
  register: activemq_install_chown_status
  changed_when: activemq_install_chown_status.stdout != ""
  become: "{{ activemq_install_require_privileges_escalation | default(true) }}"
  when:
    - activemq_install_location.stat.exists

## check remote archive
- name: Set download archive path
  ansible.builtin.set_fact:
    activemq_archive_full_path: "{{ activemq_dest }}/{{ activemq.bundle }}"

- name: Check download archive path
  become: "{{ activemq_install_require_privileges_escalation | default(true) }}"
  ansible.builtin.stat:
    path: "{{ activemq_archive_full_path }}"
  register: activemq_archive_stat

## download to controller
- name: Download activemq archive
  when:
    - activemq_archive_stat is defined
    - activemq_archive_stat.stat is defined
    - not activemq_archive_stat.stat.exists
    - not amq_broker_enable is defined or not amq_broker_enable
    - not activemq_offline_install
  ansible.builtin.get_url: # noqa risky-file-permissions delegated, uses controller host user
    url: "{{ activemq.download_url }}"
    dest: "{{ activemq_local_path.stat.path }}/{{ activemq.bundle }}"
    mode: '0640'
  delegate_to: localhost
  run_once: true
  retries: 3
  delay: 20

- name: Download AMQ broker from RHN using JBoss Network API
  delegate_to: localhost
  run_once: true
  when:
    - activemq_archive_stat is defined
    - activemq_archive_stat.stat is defined
    - not activemq_archive_stat.stat.exists
    - amq_broker_enable is defined and amq_broker_enable
    - not activemq_offline_install
    - rhn_username is defined and rhn_password is defined
  block:
    - name: Retrieve product download using JBoss Network API
      middleware_automation.common.product_search:
        client_id: "{{ rhn_username }}"
        client_secret: "{{ rhn_password }}"
        product_type: DISTRIBUTION
        product_version: "{{ amq_broker_version | regex_replace('7[.]([89])[.]', '7.0\\1.') }}"
        product_category: "{{ amq_broker_product_category }}"
      register: activemq_rhn_products
      delegate_to: localhost
      run_once: true

    - name: Determine install zipfile from search results
      ansible.builtin.set_fact:
        activemq_rhn_filtered_products: "{{ activemq_rhn_products.results | selectattr('file_path', 'match', '.*/amq-broker-' + amq_broker_version + '-bin.zip') }}"
      delegate_to: localhost
      run_once: true

    - name: Download AMQ Broker
      middleware_automation.common.product_download:
        client_id: "{{ rhn_username }}"
        client_secret: "{{ rhn_password }}"
        product_id: "{{ (activemq_rhn_filtered_products | first).id }}"
        dest: "{{ activemq_local_path.stat.path }}/{{ activemq.bundle }}"
      no_log: "{{ omit_rhn_output | default(true) }}"
      delegate_to: localhost
      run_once: true

- name: Check downloaded archive
  ansible.builtin.stat:
    path: "{{ activemq_local_path.stat.path }}/{{ activemq.bundle }}"
  register: activemq_local_archive_path
  delegate_to: localhost

## copy and unpack
- name: Copy archive to target nodes
  ansible.builtin.copy:
    src: "{{ activemq_local_path.stat.path }}/{{ activemq.bundle }}"
    dest: "{{ activemq_archive_full_path }}"
    owner: "{{ activemq_service_user }}"
    group: "{{ activemq_service_group }}"
    mode: '0750'
  register: activemq_new_version_downloaded
  when:
    - not activemq_archive_stat.stat.exists
    - activemq_local_archive_path.stat is defined
    - activemq_local_archive_path.stat.exists
  become: "{{ activemq_install_require_privileges_escalation | default(true) }}"

- name: "Check target directory: {{ activemq.home }}"
  ansible.builtin.stat:
    path: "{{ activemq.home }}"
  register: activemq_path_to_workdir
  become: "{{ activemq_install_require_privileges_escalation | default(true) }}"

- name: "Extract zipfile"
  when:
    - activemq_new_version_downloaded.changed or not activemq_path_to_workdir.stat.exists
  block:
    - name: "Extract {{ activemq.name }} archive on target"
      ansible.builtin.unarchive: # noqa no-handler definitely not a candidate for a handler
        remote_src: true
        src: "{{ activemq_archive_full_path }}"
        dest: "{{ activemq_dest }}"
        owner: "{{ activemq_service_user }}"
        group: "{{ activemq_service_group }}"
        list_files: true
      become: "{{ activemq_install_require_privileges_escalation | default(true) }}"
      register: activemq_new_version_extracted
      when:
        - activemq_new_version_downloaded.changed or not activemq_path_to_workdir.stat.exists
      notify:
        - restart amq_broker

    - name: "Check target directory: {{ activemq.home }}"
      ansible.builtin.stat:
        path: "{{ activemq.home }}"
      register: activemq_path_to_workdir_after_extract
      become: "{{ activemq_install_require_privileges_escalation | default(true) }}"

    - name: Link zipfile directory to wanted directory
      become: "{{ activemq_install_require_privileges_escalation | default(true) }}"
      ansible.builtin.file:
        state: link
        src: "{{ activemq_dest }}/{{ activemq_new_version_extracted.files | first }}"
        dest: "{{ activemq.home }}"
        owner: "{{ activemq_service_user }}"
        group: "{{ activemq_service_group }}"
      when:
        - not activemq_path_to_workdir_after_extract.stat.exists

- name: Inform decompression was not executed
  ansible.builtin.debug: # noqa no-handler definitely not a candidate for a handler
    msg: "{{ activemq.home }} already exists and version unchanged, skipping decompression"
  when:
    - not activemq_new_version_downloaded.changed and activemq_path_to_workdir.stat.exists
