---
- name: "Set masked hashed user password in user list"
  block:
    - name: "Set when requires to parse masked password salt"
      when:
        - not item.password is defined or not item.password is regex('^ENC\\([0-9]{4,}:[^:]+:[^:]+\\)')
      block:
        - name: "Parse passwd hash for existing user: {{ item.user }}"
          ansible.builtin.set_fact:
            activemq_existing_user: "{{ activemq_existing_users.content | b64decode
                            | regex_search('\\b' + item.user + ' ?= ?ENC\\([0-9]+:([^:]+):([^)]+)\\)', '\\1', '\\2') | default([], true) }}"
            activemq_mask_pwd: ''
          no_log: "{{ not ansible_check_mode }}"

        - name: "Parse passwd for existing user salt: {{ item.user }}"
          ansible.builtin.set_fact:
            activemq_hash_password: "{{ item.password | middleware_automation.amq.pbkdf2_hmac(
                              hashname=activemq_mask_password_hashname,
                              iterations=activemq_mask_password_iterations, hexsalt=activemq_existing_user[0]) }}"
          when:
            - activemq_existing_user is defined and activemq_existing_user | length > 0
          no_log: "{{ not ansible_check_mode }}"

        - name: Get masked password for user
          ansible.builtin.command:
            cmd: "{{ activemq.instance_home }}/bin/artemis mask --hash {{ '--password-codec' if activemq_password_codec != 'org.apache.activemq.artemis.utils.DefaultSensitiveStringCodec' else '' }} -- '{{ item.password }}'"
          environment:
            PATH: "{{ activemq_rpm_java_home }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            JAVA_HOME: "{{ activemq_rpm_java_home }}"
          become: "{{ activemq_install_require_privileges_escalation | default(true) }}"
          become_user: "{{ activemq_service_user }}"
          no_log: "{{ not ansible_check_mode }}"
          register: activemq_mask_pwd
          changed_when: false
          when:
            - activemq_existing_user is not defined or activemq_existing_user | length == 0 or activemq_hash_password != activemq_existing_user[1]

        - name: Add existing user with new masked password to users list
          ansible.builtin.set_fact:
            activemq_masked_users: "{{ activemq_masked_users | default([]) +
                              [{ 'user': item.user,
                                'password': activemq_mask_pwd.stdout | regex_search('result: (.+)', '\\1', multiline=true) | first,
                                'roles': item.roles }] }}"
          no_log: "{{ not ansible_check_mode }}"
          when:
            - activemq_existing_user is not defined or activemq_existing_user | length == 0 or activemq_hash_password != activemq_existing_user[1]
            - item.password is defined and item.password | length > 0
            - not item.password is regex('^ENC\\([0-9]{4,}:[^:]+:[^:]+\\)')

        - name: Add existing user with current masked password to users list
          ansible.builtin.set_fact:
            activemq_masked_users: "{{ activemq_masked_users | default([]) +
                              [{ 'user': item.user,
                                'password': activemq_mask_password_iterations | string + ':' + activemq_existing_user[0] + ':' + activemq_existing_user[1],
                                'roles': item.roles }] }}"
          no_log: "{{ not ansible_check_mode }}"
          when:
            - activemq_existing_user is defined and activemq_existing_user | length > 0
            - activemq_hash_password == activemq_existing_user[1]
            - item.password is defined and item.password | length > 0
            - not item.password is regex('^ENC\\([0-9]{4,}:[^:]+:[^:]+\\)')

    - name: Add user with pre-masked password to users list
      ansible.builtin.set_fact:
        activemq_masked_users: "{{ activemq_masked_users | default([]) +
                          [{ 'user': item.user,
                             'password': item.password | regex_search('ENC\\((.+)\\)', '\\1', multiline=true) | first,
                             'roles': item.roles }] }}"
      no_log: "{{ not ansible_check_mode }}"
      when:
        - item.password is defined and item.password | length > 0
        - item.password is regex('^ENC\\([0-9]{4,}:[^:]+:[^:]+\\)')
