---
### required variables


### internal variables
activemq:  # noqa var-naming false positive
  home: "{{ activemq_installdir }}"
  user_home: "{{ activemq_service_user_home }}"
  version: "{{ activemq_version }}"
  download_url: "{{ activemq_download_url }}"
  bundle: "{{ activemq_archive }}"
  name: "{{ activemq_name }}"
  service_name: "{{ activemq_service_name }}"
  instance_name: "{{ activemq_instance_name }}"
  instance_home: "{{ activemq_dest }}/{{ activemq_instance_name }}"
  config_xsd: "https://github.com/apache/activemq-artemis/raw/{{ activemq_version }}/artemis-server/src/main/resources/schema/artemis-configuration.xsd"
  server_xsd: "https://github.com/apache/activemq-artemis/raw/{{ activemq_version }}/artemis-server/src/main/resources/schema/artemis-server.xsd"
  package_list: "{{ activemq_base_package_list + [activemq_jvm_package] + \
                   ([activemq_jmx_exporter_package] if activemq_jmx_exporter_enabled else []) + \
                   (['iputils'] if activemq_network_check_enabled else []) }}"
  prometheus_package: "{{ 'com.redhat.amq.broker.' if amq_broker_enable is defined and \
    amq_broker_enable and activemq_version.split('.')[1] | int >= 11 \
    else 'org.apache.activemq.artemis.' }}"

activemq_logger_opts: "{{ '-Dlog4j.configurationFile=' + activemq_logger_config_template | basename | regex_replace('[.]j2$', '')\
                        if activemq_logger_config_keep_name and activemq_logger_config_template != 'log4j2.properties.j2' else '' }}"
activemq_jmx_opts: "{{ '-javaagent:/usr/share/java/prometheus-jmx-exporter/jmx_prometheus_javaagent.jar=0.0.0.0:' + \
                     activemq_jmx_exporter_port + ':' + activemq_jmx_exporter_config_path if activemq_jmx_exporter_enabled else '' }}"
activemq_properties_opts: "{{ ('-Dbroker.properties=' + activemq.instance_home + '/etc/' + \
                          activemq_properties_file) if activemq_properties_file != '' else '' }}"

activemq_base_package_list:
  - unzip
  - iproute
  - sed
  - procps-ng
  - initscripts
  - libaio
  - python3-lxml
  - tzdata-java

activemq_core_configuration_list:
  - persistence_enabled
  - persist_id_cache
  - id_cache_size
  - journal_type
  - paging_directory
  - bindings_directory
  - journal_directory
  - large_messages_directory
  - journal_datasync
  - journal_min_files
  - journal_pool_files
  - journal_device_block_size
  - journal_file_size
  - journal_buffer_timeout
  - journal_max_io
  - journal_buffer_size
  - disk_scan_period
  - max_disk_usage
  - configuration_file_refresh_period
  - global_max_messages
  - global_max_size
  - password_codec
  - message_counter_enabled
  - message_counter_sample_period
  - message_counter_max_day_history
  - critical_analyzer
  - critical_analyzer_timeout
  - critical_analyzer_check_period
  - critical_analyzer_policy
